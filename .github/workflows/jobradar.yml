name: JobRadar

on:
  schedule:
    - cron: "0 */3 * * *"
  workflow_dispatch: {}

concurrency:
  group: jobradar-cycle
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  buscar-vagas:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    defaults:
      run:
        working-directory: job-radar-main
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependências
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Rodar JobRadar (somente vagas remotas do Brasil)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python main.py --perfil brasil --once

      - name: Persistir banco de vagas vistas
        working-directory: .
        run: |
          git config user.name "jobradar-bot"
          git config user.email "jobradar-bot@users.noreply.github.com"
          if [ ! -f job-radar-main/data/jobs.db ]; then
            echo "Banco data/jobs.db não existe ao fim do ciclo."
            exit 1
          fi
          cp job-radar-main/data/jobs.db "${RUNNER_TEMP:-/tmp}/jobs.db"
          n=0
          while :; do
            git fetch origin main
            git reset --hard origin/main
            cp "${RUNNER_TEMP:-/tmp}/jobs.db" job-radar-main/data/jobs.db
            git add job-radar-main/data/jobs.db
            if git diff --cached --quiet; then
              echo "Nada novo para commitar."
              exit 0
            fi
            git commit -m "chore: atualiza vagas vistas [skip ci]"
            if git push; then
              exit 0
            fi
            n=$((n + 1))
            if [ "$n" -ge 5 ]; then
              echo "Push falhou depois de 5 tentativas."
              exit 1
            fi
            sleep $((RANDOM % 5 + 1))
          done

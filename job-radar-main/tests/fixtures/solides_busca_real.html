<script>self.__next_f.push([1, "\u003cp\u003eVAGA: ANALISTA COMERCIAL SÊNIOR\u003cbr /\u003eAtec Medical | Soluções Hospitalares\u003c/p\u003e\n\u003cp\u003e📍 Local: Cidade Dutra – Zona Sul de São Paulo\u003cbr /\u003e🏢 Modalidade: 100% Presencial\u003c/p\u003e\n\u003cp\u003e📌 SOBRE A OPORTUNIDADE\u003c/p\u003e\n\u003cp\u003eA Atec Medical, empresa especializada em soluções e equipamentos médico-hospitalares, busca um profissional para integrar sua área comercial.\u003c/p\u003e\n\u003cp\u003eProcuramos alguém com experiência sólida em vendas e relacionamento com clientes, perfil proativo, boa comunicação e capacidade de organização e liderança.\u003c/p\u003e\n\u003cp\u003eBuscamos um profissional que saiba construir relacionamentos de confiança, identificar oportunidades de negócio e acompanhar todo o processo comercial, desde o primeiro contato até o fechamento da venda.\u003c/p\u003e\n\u003cp\u003e📋 PRINCIPAIS RESPONSABILIDADES\u003c/p\u003e\n\u003cp\u003e* Realizar atendimento comercial ativo e receptivo por telefone, WhatsApp e e-mail.\u003cbr /\u003e* Desenvolver e manter relacionamentos com clientes, identificando necessidades e oportunidades de negócio.\u003cbr /\u003e* Elaborar, enviar e acompanhar propostas comerciais e orçamentos.\u003cbr /\u003e* Realizar follow-ups estratégicos, conduzindo negociações e buscando o fechamento de vendas.\u003cbr /\u003e* Prospectar novos clientes e desenvolver oportunidades na carteira existente.\u003cbr /\u003e* Acompanhar pedidos, prazos e demandas comerciais, garantindo uma comunicação eficiente com os clientes.\u003cbr /\u003e* Organizar e atualizar informações no CRM, acompanhando oportunidades e negociações.\u003cbr /\u003e* Monitorar indicadores comerciais, metas e resultados.\u003cbr /\u003e* Contribuir para a organização e melhoria dos processos internos da área comercial.\u003cbr /\u003e* Apoiar a equipe, compartilhar boas práticas e assumir responsabilidades de liderança quando necessário.\u003c/p\u003e\n\u003cp\u003e✅ REQUISITOS\u003c/p\u003e\n\u003cp\u003e* Experiência comprovada na área comercial, preferencialmente em vendas B2B.\u003cbr /\u003e* Vivência em negociação, elaboração de propostas e fechamento de vendas.\u003cbr /\u003e* Experiência com atendimento e relacionamento com clientes por telefone e canais digitais.\u003cbr /\u003e* Experiência anterior em liderança, supervisão ou orientação de equipes comerciais.\u003cbr /\u003e* Conhecimento em ferramentas de CRM, sistemas ERP e pacote Office, especialmente Excel.\u003cbr /\u003e* Excelente comunicação verbal e escrita.\u003cbr /\u003e* Organização, autonomia, iniciativa e capacidade de resolução de problemas.\u003cbr /\u003e* Perfil orientado a resultados, com habilidade para trabalhar com metas e prioridades.\u003c/p\u003e\n\u003cp\u003e⭐ DIFERENCIAIS\u003c/p\u003e\n\u003cp\u003e* Experiência no segmento médico-hospitalar, equipamentos médicos ou materiais cirúrgicos.\u003cbr /\u003e* Conhecimento de processos comerciais envolvendo hospitais, clínicas e instituições de saúde.\u003cbr /\u003e* Experiência com vendas consultivas e negociações de maior complexidade.\u003cbr /\u003e* Vivência na implementação ou melhoria de processos comerciais.\u003cbr /\u003e* Conhecimento em análise de indicadores e gestão de carteira de clientes.\u003c/p\u003e\n\u003cp\u003e🎯 PERFIL QUE BUSCAMOS\u003c/p\u003e\n\u003cp\u003eValorizamos profissionais que tenham iniciativa, senso de responsabilidade e capacidade de antecipar necessidades, sem depender constantemente de direcionamento.\u003c/p\u003e\n\u003cp\u003eÉ importante ter facilidade para conversar com clientes, construir relações comerciais duradouras, lidar com diferentes situações e buscar soluções de maneira prática.\u003c/p\u003e\n\u003cp\u003eBuscamos alguém com postura profissional, espírito de equipe e potencial para contribuir tanto com os resultados comerciais quanto com o desenvolvimento da área.\u003c/p\u003e\n\u003cp\u003e📍 Local de trabalho: Cidade Dutra – São Paulo/SP.\u003cbr /\u003ePreferência por profissionais residentes na Zona Sul ou com fácil acesso à região.\u003c/p\u003e"])</script>
<script>self.__next_f.push([1, "1f:T544,\u003cp\u003eVocê é apaixonado(a) por marketing, estratégia e inovação? Gosta de atuar em diferentes frentes, desde campanhas digitais até organização de eventos? Então essa oportunidade pode ser para você!\u003c/p\u003e\n\u003cp\u003eEstamos em busca de um(a) \u003cstrong\u003eAnalista de Marketing\u003c/strong\u003e com perfil estratégico, analítico e organizado para fortalecer nossa equipe e contribuir com o crescimento e posicionamento da empresa. \u003c/p\u003e\n\u003ch3\u003e🚀 Principais responsabilidades\u003c/h3\u003e\n\u003cul\u003e\n\u003cli\u003eGerenciar e acompanhar campanhas de mídia paga (Google Ads, Meta Ads e outras plataformas), em conjunto com o gestor de tráfego;\u003c/li\u003e\n\u003cli\u003eAdministrar o CRM e acompanhar o desempenho da equipe de SDRs;\u003c/li\u003e\n\u003cli\u003ePlanejar, organizar e acompanhar eventos e feiras do setor agro;\u003c/li\u003e\n\u003cli\u003eDesenvolver e executar campanhas de marketing online e offline;\u003c/li\u003e\n\u003cli\u003eElaborar apresentações, indicadores e relatórios de desempenho;\u003c/li\u003e\n\u003cli\u003eControlar o orçamento da área e acompanhar os resultados das ações;\u003c/li\u003e\n\u003cli\u003eRealizar pesquisas de mercado e análises estratégicas para identificar oportunidades de crescimento;\u003c/li\u003e\n\u003cli\u003eAcompanhar as ações de marketing da Goodyear e garantir a implementação das iniciativas na empresa;\u003c/li\u003e\n\u003cli\u003eUtilizar ferramentas de Inteligência Artificial para otimizar processos e gerar eficiência nas atividades de marketing.\u003c/li\u003e\n\u003c/ul\u003e20:T16f6,"])</script>
<script>self.__next_f.push([1, "\u003cp\u003eCom experiência em gestão de negócios desde 1955, a \u003cstrong\u003eWLM\u003c/strong\u003e atua de forma estratégica e integrada nos segmentos automotivo, do agronegócio, de energia e de soluções sustentáveis, consolidando-se como um grupo sólido, diversificado e em constante evolução. \u003c/p\u003e\n\u003cp\u003eO principal foco dos negócios da WLM é a comercialização de produtos e serviços da marca Scania, incluindo caminhões pesados e extrapesados, chassis para ônibus rodoviários e urbanos, venda de peças genuínas, além da prestação de serviços de manutenção corretiva e preventiva e assistência técnica especializada. \u003c/p\u003e\n\u003cp\u003e No segmento de\u003cstrong\u003e concessionárias Scania\u003c/strong\u003e, a WLM está presente em mais de 20 pontos no país, atendendo seis estados brasileiros, por meio das operações \u003cstrong\u003eEquipo (RJ), Itaipu (MG), Itaipu Norte (PA), Quinta Roda (SP) e Supermac (AM e RR).\u003c/strong\u003e \u003c/p\u003e\n\u003cp\u003eNo segmento do \u003cstrong\u003eagronegócio\u003c/strong\u003e, por meio de suas controladas \u003cstrong\u003eFartura (Sul do Pará) e Itapura (Norte do Mato Grosso, Sul de Minas e região de Campinas/SP)\u003c/strong\u003e, a WLM atua nas atividades de cria, recria e engorda de bovinos, além da produção e comercialização de café, soja e milho. Com forte compromisso com a sustentabilidade, suas atividades produtivas são executadas com foco nas melhores práticas de preservação da fauna e flora nativas, bem como no cuidado com a água e o solo. \u003c/p\u003e\n\u003cp\u003eEm 2025, a WLM anunciou a aquisição de 60% da \u003cstrong\u003eCHP Brasil\u003c/strong\u003e, empresa referência em geração distribuída e eficiência energética. Com essa aquisição, o grupo amplia sua presença estratégica, diversifica seu portfólio e dá um passo significativo em direção ao futuro, reforçando seu compromisso com a sustentabilidade e com a criação de novas oportunidades de negócio no setor de energia. \u003c/p\u003e\n\u003cp\u003eComo parte dessa estratégia de inovação, sustentabilidade e diversificação dos negócios, nasce a \u003cstrong\u003eEkotruck\u003c/strong\u003e, uma startup criada dentro do Grupo WLM com o propósito de oferecer sempre a melhor solução em peças e serviços para seus clientes. A empresa expande o foco do grupo por meio da reciclagem de caminhões, da oferta de peças alternativas, componentes remanufaturados e contratos de manutenção, com forte uso de tecnologia. Seu foco principal está na redução do TCO (Custo Total de Propriedade) dos clientes, no fortalecimento da economia circular e na geração de eficiência operacional sustentável. \u003c/p\u003e\n\u003cp\u003eA localização estratégica das unidades da WLM permite uma atuação com ampla cobertura geográfica, garantindo agilidade, qualidade e excelência no atendimento. \u003c/p\u003e\n\u003cp\u003eA holding do grupo está localizada no Rio de Janeiro e conta com uma filial corporativa em Contagem/MG. \u003c/p\u003e\n\u003cp\u003eVem acelerar a sua carreira com o Grupo WLM! \u003c/p\u003e\n\u003cp\u003eConfira as atribuições e vantagens da vaga de \u003cstrong\u003eAnalista de Gestão Comercial para a Ekotruck\u003c/strong\u003e abaixo e venha fazer parte desse time de sucesso: \u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eSua missão:\u003c/strong\u003e \u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e\n\u003cp\u003eAtualizar e manter tabelas de preços de peças novas e seminovas, acompanhando reajustes e informações de mercado;\u003c/p\u003e\n\u003c/li\u003e\n\u003cli\u003e\n\u003cp\u003eColetar, organizar e consolidar dados de vendas, estoque e concorrência, apoiando a elaboração de relatórios comerciais;\u003c/p\u003e\n\u003c/li\u003e\n\u003cli\u003e\n\u003cp\u003eDesenvolver, atualizar e acompanhar planilhas de controle e dashboards, garantindo a confiabilidade das informações;\u003c/p\u003e\n\u003c/li\u003e\n\u003cli\u003e\n\u003cp\u003eRealizar a atualização do CRM, acompanhando oportunidades comerciais, negociações e pendências junto à equipe de vendas;\u003c/p\u003e\n\u003c/li\u003e\n\u003cli\u003e\n\u003cp\u003eApoiar o planejamento e a execução de campanhas de marketing, organizando conteúdos, materiais e cronogramas de publicações;\u003c/p\u003e\n\u003c/li\u003e\n\u003cli\u003e\n\u003cp\u003eAtualizar cadastros de produtos, preços, imagens e descrições em plataformas de e-commerce e marketplaces;\u003c/p\u003e\n\u003c/li\u003e\n\u003cli\u003e\n\u003cp\u003ePrestar suporte administrativo e operacional às áreas, auxiliando na organização de informações, documentos e demandas internas\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eRequisitos:\u003c/strong\u003e\u003c/p\u003e\n\u003c/li\u003e\n\u003cli\u003e\n\u003cp\u003eEnsino superior em Administração, Marketing, Gestão Comercial ou áreas correlatas;\u003c/p\u003e\n\u003c/li\u003e\n\u003cli\u003e\n\u003cp\u003eExcel intermediário;\u003c/p\u003e\n\u003c/li\u003e\n\u003cli\u003e\n\u003cp\u003eFacilidade com sistemas e ferramentas digitais;\u003c/p\u003e\n\u003c/li\u003e\n\u003cli\u003e\n\u003cp\u003eOrganização, atenção aos detalhes e boa comunicação.\u003c/p\u003e\n\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e\u003cstrong\u003eVantagens/Benefícios: \u003c/strong\u003e \u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eTicket Alimentação - pensado para garantir praticidade no cuidado com a sua casa e família. \u003c/li\u003e\n\u003c/ul\u003e\n\u003cul\u003e\n\u003cli\u003eRefeição no local - para garantir refeições mais práticas e tranquilas no seu dia a dia. \u003c/li\u003e\n\u003c/ul\u003e\n\u003cul\u003e\n\u003cli\u003eVale Transporte - para apoiar seu deslocamento no trajeto casa x trabalho x casa. \u003c/li\u003e\n\u003c/ul\u003e\n\u003cul\u003e\n\u003cli\u003eAssistência Médica - cuidando da sua saúde e de quem você ama. \u003c/li\u003e\n\u003c/ul\u003e\n\u003cul\u003e\n\u003cli\u003eAssistência Odontológica - cuidando do seu sorriso e de toda a sua família. \u003c/li\u003e\n\u003c/ul\u003e\n\u003cul\u003e\n\u003cli\u003eCartão Farmácia – facilidade e conveniência para cuidar da sua saúde e bem-estar. \u003c/li\u003e\n\u003c/ul\u003e\n\u003cul\u003e\n\u003cli\u003eSeguro de Vida em Grupo e Assistência Funeral - proteção e segurança para você e sua família em momentos delicados. \u003c/li\u003e\n\u003c/ul\u003e\n\u003cul\u003e\n\u003cli\u003eWellhub (Gympass) - incentivo à prática de atividades físicas e ao bem-estar. \u003c/li\u003e\n\u003c/ul\u003e\n\u003cul\u003e\n\u003cli\u003eTelemedicina: Dra. AON | Conexa Saúde - apoio à sua saúde com praticidade e rapidez, sempre que precisar. \u003c/li\u003e\n\u003c/ul\u003e\n\u003cul\u003e\n\u003cli\u003eParceria Open English – curso de idiomas com condições exclusivas para colaboradores. \u003c/li\u003e\n\u003c/ul\u003e\n\u003cul\u003e\n\u003cli\u003ePetlove - plano de assistência médica para cães e gatos, cuidando da saúde do seu melhor amigo com carinho, segurança e tranquilidade.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e\u003cstrong\u003eHorário de trabalho: \u003c/strong\u003esegunda à sexta-feira, das 08:00\u003cstrong\u003e \u003c/strong\u003eàs 17:48\u003cstrong\u003e.\u003c/strong\u003e \u003c/p\u003e"])</script>

<script>self.__next_f.push([1, "\u003cp\u003eNosso time é formado por pessoas com brilho no olho e vontade de fazer a diferença.\u003c/p\u003e\n\u003cp\u003eCom 15 anos de atuação, somos especialistas em incorporação e urbanismo, trazendo um novo conceito de moradia, traduzindo o estilo de vida contemporâneo em empreendimentos únicos, conectados à natureza e com arquitetura autoral.\u003c/p\u003e\n\u003cp\u003eNossa sede fica localizada em Itapema/SC e também estamos presentes em Balneário Camboriú, Blumenau, Camboriú, Itajaí, Navegantes e Porto Belo.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eSOBRE A OPORTUNIDADE:\u003c/strong\u003e\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eRealizar atendimento aos clientes por diferentes canais (telefone, WhatsApp, e-mail e presencial), prestando informações claras e assertivas;\u003c/li\u003e\n\u003cli\u003eAcompanhar a jornada do cliente desde a assinatura do contrato até o pós-entrega do imóvel;\u003c/li\u003e\n\u003cli\u003eAtuar de forma empática, acolhedora e profissional, zelando pela boa experiência do cliente;\u003c/li\u003e\n\u003cli\u003eReceber, registrar, acompanhar e dar retorno sobre solicitações, dúvidas, reclamações e demandas dos clientes;\u003c/li\u003e\n\u003cli\u003eInterface com áreas internas (Comercial, Engenharia, Financeiro, Jurídico e Obras) para encaminhamento e acompanhamento das demandas;\u003c/li\u003e\n\u003cli\u003eMonitorar prazos de resposta e garantir retorno dentro dos SLAs definidos;\u003c/li\u003e\n\u003cli\u003eApoiar os processos de entrega de chaves, orientações de uso do imóvel e documentação necessária;\u003c/li\u003e\n\u003cli\u003eApoiar ações de relacionamento no pós-entrega, fortalecendo a satisfação e fidelização do cliente.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e\u003cstrong\u003eO QUE ESPERAMOS QUE VOCÊ TENHA:\u003c/strong\u003e\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eEnsino superior completo ou em andamento em Administração, Gestão Comercial;\u003c/li\u003e\n\u0
